function mediaEl(m,style,cls=''){if(m.contain)cls+=' contain'; if(!m.i&&!m.v)return `<div class="m" style="${style}"></div>`; return m.v?`<div class="m ${cls}" style="${style}"><video src="${m.v}" poster="${m.poster}" muted loop playsinline preload="none"></video></div>`
  :`<div class="m ${cls}" style="${style}"><img src="${m.i}" alt="" loading="lazy" decoding="async"></div>`;}
function justify(rows){ // whole images, no cropping; every row exactly the same width so edges line up
  const sumAr=rows.map(r=>r.reduce((a,m)=>a+m.ar,0));
  const heightAt=W=>rows.reduce((t,r,i)=>t+(W-GAP*(r.length-1))/sumAr[i],0)+GAP*(rows.length-1);
  let W=MW; if(heightAt(W)>MH){let lo=50,hi=MW;for(let i=0;i<40;i++){const m=(lo+hi)/2;heightAt(m)>MH?hi=m:lo=m;}W=lo;}
  const x0=(MW-W)/2; let y=(MH-heightAt(W))/2, out='';
  rows.forEach((r,ri)=>{const h=(W-GAP*(r.length-1))/sumAr[ri]; let x=x0;
    r.forEach((m,j)=>{const w=j===r.length-1? x0+W-x : m.ar*h; out+=mediaEl(m,`left:${x}px;top:${y}px;width:${w}px;height:${h}px`); x+=w+GAP;}); y+=h+GAP;});
  return out;}
function tiles(t,items){ // equal boxes, each picture fitted whole inside
  const w=(MW-GAP*(t.cols-1))/t.cols, h=w/t.ar, n=Math.ceil(items.length/t.cols), H=n*h+GAP*(n-1); let out='';
  items.forEach((m,i)=>{const x=(i%t.cols)*(w+GAP), y=(MH-H)/2+Math.floor(i/t.cols)*(h+GAP);
    out+=mediaEl({...m,contain:0},`left:${x}px;top:${y}px;width:${w}px;height:${h}px`);});
  return out;}
function canvas(c){ // original page compositions, scaled into the page
  let w=MW, h=w/c.ar; if(h>MH){h=MH;w=h*c.ar;}
  const ox=(MW-w)/2, oy=(MH-h)/2;
  return `<div class="canv" style="left:${ox}px;top:${oy}px;width:${w}px;height:${h}px">${c.items.map(m=>
    mediaEl(m,`left:${m.x}%;top:${m.y}%;width:${m.w}%;height:${m.h}%;${m.scale?`transform:scale(${m.scale});`:''}${m.pos?`--pos:${m.pos};`:''}`,m.contain?'contain':'')).join('')}</div>`;}

};
// faces in reading order

const TOTAL=faces.length, book=document.getElementById('book');

if(MOBILE) document.body.classList.add('mobile');

  d.innerHTML=`<div class="pg">${html}${i>0&&i<TOTAL-1?`<span class="folio">${pad2(i)}</span>`:''}</div>`; book.appendChild(d);});
if(!MOBILE) book.appendChild(blank());

// food collage: equal padding to all four page edges, free placement inside
const FOOD=[[12,40,58,105,105, 70,205,0],[3,188,36,150,150, 300,214,0],[2,404,68,95,95, 452,192,0],
  [4,36,248,130,130, 186,392,0],[11,226,246,120,120, 330,392,0],[10,394,226,26,132, 362,206,-12],[5,446,300,80,80, 500,404,0],
  [1,46,456,112,112, 186,488,0],[7,218,448,122,122, 284,604,0],[8,426,440,90,90, 384,470,0],
  [9,56,604,82,82, 168,664,-6],[6,426,584,96,96, 382,664,0]];
const K=0.82, PAD=56, W=550, H=700;
const els=FOOD.map(([n,x,y,w,h,lx,ly,r])=>({n,cx:x+w/2,cy:y+h/2,w:w*K,h:h*K,lx,ly,r}));
function fitAxis(get,size,inner){ // find scale s on centres so extent fits inner exactly
  const ext=s=>{let mn=1e9,mx=-1e9;els.forEach(e=>{const [c,half,lc]=get(e);mn=Math.min(mn,s*c-half,s*lc-12);mx=Math.max(mx,s*c+half,s*lc+12);});return [mn,mx];};
  let lo=0.3,hi=3;for(let i=0;i<40;i++){const m=(lo+hi)/2;const [a,b]=ext(m);(b-a>inner?hi=m:lo=m);}
  const s=(lo+hi)/2,[a]=ext(s);return v=>PAD+(s*v-a);
}
const mx=fitAxis(e=>[e.cx,e.w/2,e.lx],W,W-2*PAD), my=fitAxis(e=>[e.cy,e.h/2,e.ly],H,H-2*PAD);
const food=document.getElementById('food'), fsvg=document.getElementById('fsvg'); const foodEls=[];
els.forEach(e=>{
  const cx=mx(e.cx), cy=my(e.cy), lx=mx(e.lx), ly=my(e.ly);
  const it=document.createElement('div'); it.className='item';
  const dl=(foodEls.length*0.07).toFixed(2)+'s'; it.style.cssText=`left:${cx-e.w/2}px;top:${cy-e.h/2}px;width:${e.w}px;height:${e.h}px;--r:${e.r}deg;--d:${dl}`;
  it.innerHTML=`<img src="img/food-${e.n}.webp" alt="">`; food.appendChild(it);
  const lab=document.createElement('div'); lab.className='num'; lab.textContent=`(${e.n})`; lab.style.setProperty('--d',dl); lab.style.left=(lx-16)+'px'; lab.style.top=(ly-9)+'px'; food.appendChild(lab);
  // soft curve from under the dish (so it always touches it) to the edge of its number
  const dx=lx-cx, dy=ly-cy, d=Math.hypot(dx,dy), ux=dx/d, uy=dy/d;
  const te=Math.min(17/Math.max(Math.abs(ux),1e-3), 10/Math.max(Math.abs(uy),1e-3))+1;
  const ex=lx-ux*te, ey=ly-uy*te, mxp=(cx+ex)/2, myp=(cy+ey)/2, bend=Math.min(14,d*0.12);
  const L=document.createElementNS('http://www.w3.org/2000/svg','path');
  L.setAttribute('d',`M${cx},${cy} Q${mxp-uy*bend},${myp+ux*bend} ${ex},${ey}`); fsvg.appendChild(L);
  const len=L.getTotalLength(); L.style.setProperty('--d',dl); L.style.strokeDasharray=len; L.style.strokeDashoffset=len;
  foodEls.push({it,lab,L,len});
});

// real page curl (StPageFlip), driven by scroll one spread at a time
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const wrap=document.getElementById('wrap');
let layout='centred';
function fit(){ if(MOBILE){ const sc=Math.min((innerWidth-28)/550,(innerHeight-140)/900); wrap.style.setProperty('--s',sc.toFixed(3)); return; } const k=layout==='centred'?0.68:1; const sc=Math.min((innerWidth-(layout==='centred'?0:80))*k/1100,(innerHeight-150)*k/700,1.15); wrap.style.setProperty('--s',sc.toFixed(3));}
const pf=new St.PageFlip(book,{width:550,height:MOBILE?900:700,size:'fixed',showCover:false,usePortrait:MOBILE,useMouseEvents:!MOBILE,drawShadow:true,maxShadowOpacity:.6,
  flippingTime:650,mobileScrollSupport:false,disableFlipByClick:true,showPageCorners:true,startZIndex:2});
pf.loadFromHTML(document.querySelectorAll('#book .page'));
const spreadOf=i=>MOBILE?i:Math.floor(i/2); // library index (blank page at 0)
const pageOf=s=>MOBILE?s:2*s;
let busy=false;
const pages=[...document.querySelectorAll('#book .page')];
function setShift(){const pi=pf.getCurrentPageIndex(), sp=spreadOf(pi);
  if(MOBILE){ wrap.style.setProperty('--shift','0%'); document.getElementById('food').classList.toggle('on',pi===2); return; }
  wrap.style.setProperty('--shift',sp===0?'-25%':sp===S-1?'25%':'0%');
  const frac=pi/(pages.length-2);
  wrap.style.setProperty('--wl',(sp===0?0:2+7*frac).toFixed(1)+'px'); wrap.style.setProperty('--wr',(sp===S-1?0:2+7*(1-frac)).toFixed(1)+'px');
  const closed=sp===0||sp===S-1; const want=closed?'centred':'full'; if(layout!==want){layout=want; fit();} document.getElementById('stackL').style.opacity=closed?0:1; document.getElementById('stackR').style.opacity=closed?0:1;
  document.getElementById('food').classList.toggle('on',sp===1);}
// videos: everything paused while pages move; only the open spread plays once it has landed
function pauseAll(){document.querySelectorAll('#book video').forEach(v=>{if(!v.paused)v.pause();});}
function playOpen(){const pi=pf.getCurrentPageIndex();
  pages.forEach((pg,i)=>pg.querySelectorAll('video').forEach(v=>{ if(i===pi||(!MOBILE&&i===pi+1)){ if(v.preload!=='auto'){v.preload='auto';} v.play().catch(()=>{}); } else if(!v.paused) v.pause(); }));
  // warm up the next spread's videos so they start instantly
  [pi+2,pi+3].forEach(i=>pages[i]&&pages[i].querySelectorAll('video').forEach(v=>{if(v.preload==='none'){v.preload='metadata';v.load();}}));}
function go(dir,fast){ if(busy) return false; const sp=spreadOf(pf.getCurrentPageIndex()), t=sp+dir; if(t<0||t>S-1) return false;
  busy=true; pauseAll(); pf.getSettings().flippingTime=fast?450:650;
  // closing the magazine: the page printed on the back of the cover lifts away with it, and the page-block disappears
  if(!MOBILE&&(t===0||t===S-1)){     document.getElementById('stackL').style.opacity=0; document.getElementById('stackR').style.opacity=0;
    setTimeout(()=>{wrap.style.setProperty('--shift',t===0?'-25%':'25%'); layout='centred'; fit();},250); }
  if(!MOBILE&&(sp===0||sp===S-1)){ setTimeout(()=>{layout='full'; fit(); wrap.style.setProperty('--shift','0%');},150); }
  dir>0?pf.flipNext('bottom'):pf.flipPrev('bottom');
  document.getElementById('hint').style.setProperty('--hint',0); return true;}
pf.on('changeState',e=>{ if(e.data==='read'){busy=false; setShift(); if(queued){const q=queued; queued-=Math.sign(q); setTimeout(()=>{ if(!go(Math.sign(q),true)) {queued=0; playOpen();} },0); return;} playOpen();} else {busy=true; pauseAll();} });
pf.on('flip',setShift);
// one page per scroll gesture: trackpad momentum after a turn is ignored; a fresh push turns the next page
let acc=0, locked=false, idleT, last=0, lastFlipAt=0, lastEvt=0, queued=0;
addEventListener('wheel',e=>{ e.preventDefault(); const d=Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX, a=Math.abs(d), now=performance.now();
  const gap=now-lastEvt; lastEvt=now;
  // a separate mouse-wheel click (big delta after a pause) always counts, even mid-turn: it queues the next page
  if(a>=50 && gap>40 && locked){ if(busy){ if(queued<4) queued+=Math.sign(d)>0?1:-1; } else { go(Math.sign(d)); lastFlipAt=now; } return; }
  clearTimeout(idleT); idleT=setTimeout(()=>{locked=false;acc=0;last=0;},180);
  if(locked){ if(!busy && now-lastFlipAt>350 && a>last*1.6+6){locked=false;acc=0;} else {last=a; return;} }
  last=a; acc+=d;
  if(Math.abs(acc)>=40){ if(go(Math.sign(acc))){locked=true; lastFlipAt=now;} acc=0; } },{passive:false});
addEventListener('keydown',e=>{ if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(1);} if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(-1);} });
let tx=0,ty=0; addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; if(Math.max(Math.abs(dx),Math.abs(dy))<40)return; go((Math.abs(dy)>Math.abs(dx)?dy:dx)<0?1:-1);},{passive:true});
addEventListener('resize',fit);
// The blank pages either side of the covers are transparent (so the table shows). When the library reveals one,
// the page underneath would show through, so we clip that page to the exact opposite of the reveal, every frame.
const allPages=[...document.querySelectorAll('#book .page')], LB=allPages[0], RB=allPages[allPages.length-1];
const victims=[[LB,allPages[2]],[RB,allPages[allPages.length-3]]];
(function guard(){ if(MOBILE) return; victims.forEach(([blank,under])=>{ if(!under) return;
    const cp=blank.style.clipPath, m=cp&&cp.match(/polygon\((.*)\)/);
    if(m && blank.style.display!=='none' && /translate3d/.test(blank.style.transform)){
      const pts=m[1].split(',').map(q=>q.trim().split(/\s+/).map(parseFloat));
      const tr=blank.style.transform.match(/translate3d\(([-\d.e]+)px,\s*([-\d.e]+)px/), ang=(blank.style.transform.match(/rotate\(([-\d.e]+)rad/)||[0,0])[1]*1;
      const tx=tr?+tr[1]:0, ty=tr?+tr[2]:0, ox=parseFloat(blank.style.left)||0, ux=parseFloat(under.style.left)||0, c=Math.cos(ang), sn=Math.sin(ang);
      const w=pts.map(([x,y])=>[ox+tx+x*c-y*sn-ux, ty+x*sn+y*c]);
      under.style.clipPath=`path(evenodd, "M-5 -5 H560 V705 H-5 Z M${w.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L')} Z")`;
    } else if(under.style.clipPath && under.style.clipPath.startsWith('path')) under.style.clipPath='';
  }); requestAnimationFrame(guard); })();
// safety net: never stay locked if the library is already at rest
setInterval(()=>{ if(busy && pf.getState()==='read'){ const t=performance.now(); if(!window._stuck) window._stuck=t; else if(t-window._stuck>1200){busy=false; window._stuck=0; setShift(); playOpen();} } else window._stuck=0; },300);
document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation(); if(busy) return;
  const fi=projectFace[+el.dataset.go]+(MOBILE?0:1); busy=true; pauseAll(); pf.getSettings().flippingTime=650; pf.flip(fi,'bottom');}));
